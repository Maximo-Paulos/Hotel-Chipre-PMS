previews:
  # Deliberately manual until the provider has proven isolated Supabase Branch
  # credentials and QA-only secrets for every generated environment.
  generation: manual
  expireAfterDays: 7

services:
  - type: web
    name: hotel-chipre-pms-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    # Production capacity profile. Render autoscaling requires a Pro
    # workspace; preview environments deliberately run minInstances only.
    plan: standard
    scaling:
      minInstances: 3
      maxInstances: 50
      targetCPUPercent: 60
      targetMemoryPercent: 70
    previews:
      numInstances: 3
    envVars:
      - key: APP_ENV
        value: production
      - key: EXTERNAL_EFFECTS_ENABLED
        value: "false"
      - key: INBOUND_PROVIDER_EVENTS_ENABLED
        value: "false"
      - key: CONNECTIONS_ENABLED
        value: "false"
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_PATH
        sync: false
      - key: APPLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard (Supabase connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # set to https://hotels-pms.com,https://app.hotels-pms.com
      - key: FRONTEND_URL
        sync: false   # set to https://app.hotels-pms.com (used in invitation emails)
      - key: APP_BASE_URL
        sync: false   # set to your Render service URL, e.g. https://hotel-chipre-pms-api.onrender.com
      - key: MANAGER_PIN
        sync: false   # at least 6 digits, not 1234
      - key: INTEGRATIONS_ENCRYPTION_KEY
        sync: false   # generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: MERCADOPAGO_CLIENT_ID
        sync: false   # platform OAuth app id; required for hotels to connect their own MP account
      - key: MERCADOPAGO_CLIENT_SECRET
        sync: false   # platform OAuth app secret
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false   # required (fail-closed) once any hotel has Mercado Pago connected
      - key: PAYPAL_CLIENT_ID
        sync: false   # platform OAuth app id; required for hotels to connect their own PayPal account
      - key: PAYPAL_CLIENT_SECRET
        sync: false   # platform OAuth app secret
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: EMAIL_PROVIDER
        value: "null"
      - key: RESEND_API_KEY
        sync: false   # set in Render dashboard; required when EMAIL_PROVIDER=resend
      - key: SYSTEM_EMAIL_FROM
        sync: false   # set in Render dashboard; required when EMAIL_PROVIDER=resend
      - key: SYSTEM_EMAIL_REPLY_TO
        sync: false   # set in Render dashboard; required when EMAIL_PROVIDER=resend
      - key: GEMMA_ENABLED
        value: "false"
      - key: GEMMA_PROVIDER
        value: disabled
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: PAYPAL_MODE
        value: sandbox
      - key: ANALYTICS_EXPORTS_DIR
        value: /var/exports/analytics
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: DISTRIBUTED_LOCK_ENABLED
        value: "true"
      - key: DISTRIBUTED_LOCK_REQUIRED
        value: "true"
      - key: CLICKHOUSE_ENABLED
        value: "true"
      - key: CLICKHOUSE_REQUIRED
        value: "true"
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: hotel_analytics
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
    autoDeploy: true

  - type: keyvalue
    name: hotel-chipre-pms-redis
    # Keep this private to Render services. Persistence is required for queue
    # recovery; PostgreSQL remains the transactional source of truth.
    ipAllowList: []
    plan: standard
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: worker
    name: hotel-chipre-pms-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=4
    plan: standard
    envVars:
      - key: APP_ENV
        value: production
      - key: EXTERNAL_EFFECTS_ENABLED
        value: "false"
      - key: INBOUND_PROVIDER_EVENTS_ENABLED
        value: "false"
      - key: CONNECTIONS_ENABLED
        value: "false"
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_LOGIN_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: "null"
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: GEMMA_ENABLED
        value: "false"
      - key: GEMMA_PROVIDER
        value: disabled
      - key: PAYPAL_MODE
        value: sandbox
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: DISTRIBUTED_LOCK_ENABLED
        value: "true"
      - key: DISTRIBUTED_LOCK_REQUIRED
        value: "true"
      - key: CLICKHOUSE_ENABLED
        value: "true"
      - key: CLICKHOUSE_REQUIRED
        value: "true"
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: hotel_analytics
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false

  - type: worker
    name: hotel-chipre-pms-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app beat --loglevel=INFO
    plan: standard
    envVars:
      - key: APP_ENV
        value: production
      - key: EXTERNAL_EFFECTS_ENABLED
        value: "false"
      - key: INBOUND_PROVIDER_EVENTS_ENABLED
        value: "false"
      - key: CONNECTIONS_ENABLED
        value: "false"
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_LOGIN_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: "null"
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: GEMMA_ENABLED
        value: "false"
      - key: GEMMA_PROVIDER
        value: disabled
      - key: PAYPAL_MODE
        value: sandbox
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hotel-chipre-pms-redis
          property: connectionString
      - key: CLICKHOUSE_ENABLED
        value: "true"
      - key: CLICKHOUSE_REQUIRED
        value: "true"
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: hotel_analytics
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
