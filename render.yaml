previews:
  # Manual until every preview has isolated Supabase credentials and QA data.
  generation: manual
  expireAfterDays: 7

services:
  # Budget profile: one small, always-on API. PostgreSQL stays authoritative;
  # Redis, Celery, ClickHouse and extra API replicas are deliberately absent.
  - type: web
    name: hotel-chipre-pms-api
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown 30
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # One API instance: keep the database pool conservative. The API can
      # open at most six pooled connections; do not raise without checking the
      # Supabase connection budget and measuring pool wait under load.
      - key: DB_POOL_SIZE
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "5"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: EXTERNAL_EFFECTS_ENABLED
        value: "false"
      - key: INBOUND_PROVIDER_EVENTS_ENABLED
        value: "false"
      - key: CONNECTIONS_ENABLED
        value: "false"
      - key: DOLARAPI_RATES_ENABLED
        value: "true"
      - key: REALTIME_EVENTS_ENABLED
        value: "true"
      - key: REALTIME_EVENTS_TRANSPORT
        value: postgresql
      - key: REALTIME_EVENTS_HEARTBEAT_SECONDS
        value: "30"
      - key: REALTIME_EVENTS_FALLBACK_POLL_SECONDS
        value: "60"
      - key: POSTGRES_EVENT_LISTENER_ENABLED
        value: "true"
      - key: POSTGRES_EVENT_LISTENER_DATABASE_URL
        sync: false # Supabase direct/session URL; transaction pooler cannot retain LISTEN.
      - key: DISTRIBUTED_LOCK_ENABLED
        value: "true"
      - key: DISTRIBUTED_LOCK_REQUIRED
        value: "true"
      - key: DISTRIBUTED_LOCK_BACKEND
        value: postgresql
      # WebSocket draft fan-out and one-use tickets stay process-local. This
      # requires exactly one API instance and one Uvicorn worker.
      - key: COLLABORATION_BACKEND
        value: process
      - key: READ_MODEL_CACHE_ENABLED
        value: "false"
      - key: ANALYTICS_FACTS_SYNC_ON_WRITE
        value: "false"
      - key: ANALYTICS_WAREHOUSE_PERIODIC_REPLAY_ENABLED
        value: "false"
      - key: CLICKHOUSE_ENABLED
        value: "false"
      - key: CLICKHOUSE_REQUIRED
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_PATH
        sync: false
      - key: APPLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false # Supabase PostgreSQL URL used by request transactions.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://hotels-pms.com,https://app.hotels-pms.com
      - key: FRONTEND_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: MANAGER_PIN
        sync: false
      - key: INTEGRATIONS_ENCRYPTION_KEY
        sync: false
      - key: MERCADOPAGO_CLIENT_ID
        sync: false
      - key: MERCADOPAGO_CLIENT_SECRET
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: EMAIL_PROVIDER
        value: "null"
      - key: RESEND_API_KEY
        sync: false
      - key: SYSTEM_EMAIL_FROM
        sync: false
      - key: SYSTEM_EMAIL_REPLY_TO
        sync: false
      - key: GEMMA_ENABLED
        value: "false"
      - key: GEMMA_PROVIDER
        value: disabled
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: PAYPAL_MODE
        value: sandbox
      - key: ANALYTICS_EXPORTS_DIR
        value: /var/exports/analytics
    autoDeploy: true

  # One SQL-only scheduler per five-minute interval. It enumerates hotels once,
  # then processes no-shows, due reports, and bounded notification outboxes
  # under each hotel's RLS context. No worker, Redis, or NoSQL service required.
  - type: cron
    name: hotel-chipre-pms-scheduled-hotel-jobs
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.tasks.run_scheduled_hotel_jobs
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "1"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "5"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: EXTERNAL_EFFECTS_ENABLED
        value: "false"
      - key: INBOUND_PROVIDER_EVENTS_ENABLED
        value: "false"
      - key: CONNECTIONS_ENABLED
        value: "false"
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: APPLE_LOGIN_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: "null"
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: GEMMA_ENABLED
        value: "false"
      - key: GEMMA_PROVIDER
        value: disabled
      - key: PAYPAL_MODE
        value: sandbox
