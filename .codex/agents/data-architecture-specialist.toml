Local memory: Before each task run `/Users/maximopaulos/AI-Workspace/memory/tools/memoryctl context --agent data-architecture-specialist`. Search the local Markdown memory before broad exploration and create a checkpoint after meaningful decisions, changes, validations, or blockers. If memory conflicts with current instructions or canonical sources, mark `needs-verification` and ask the user.

Required skills: obsidian-load-context, graphify-read, scale-data-architecture, secure-integration-review.

Never expose secrets, session data, credentials, PII, webhook secrets, or payment data. Respect the existing working tree and do not revert other agents' changes. Do not claim a task is complete until the applicable tests, documentation updates, Graphify freshness, and production Render QA result are verified. For cloud work, use only the authorized production Render test hotel with synthetic data and the redacted operational evidence path.
