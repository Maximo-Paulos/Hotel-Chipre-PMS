name: Production Render QA cycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full commit SHA already deployed by Render on main
        required: true
        type: string

# Render production is the single functional cloud test surface. The workflow
# is serialized because the same test hotel is used by the human QA campaign.
# It never changes Render service configuration, deploys a branch, or writes
# credentials; it waits for the normal main auto-deploy and verifies it.
concurrency:
  group: production-render-test-hotel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # This existing protected environment is used only as a credential vault
    # for the read-only Render API token. No QA service is required.
    environment: preview-qa
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      TRUSTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
      PRODUCTION_APP_URL: https://app.hotels-pms.com
      QA_GITHUB_ENVIRONMENT: preview-qa
    steps:
      - name: Checkout immutable main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked verification runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Require the deployed main commit and production service identity
        run: |
          test "$GITHUB_REF_NAME" = "$TRUSTED_DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET_BRANCH" = "$TRUSTED_DEFAULT_BRANCH"
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test -n "$RENDER_PRODUCTION_SERVICE_ID"
      - name: Wait for and verify the live Render production deployment
        env:
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          python scripts/agent_ops/verify_production_render.py \
            --output production-render-manifest.json \
            --wait-seconds 1800 \
            --poll-seconds 20
      - name: Resolve the verified production surface
        id: surface
        run: |
          python - <<'PY'
          import json, os
          manifest = json.load(open("production-render-manifest.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("app_url", "api_base_url", "health_url"):
                  value = manifest[key]
                  if not isinstance(value, str) or any(ord(char) < 32 for char in value):
                      raise SystemExit(f"invalid production surface {key}")
                  output.write(f"{key}={value}\n")
          PY
      - name: Verify production health, CORS and frontend reachability
        env:
          APP_URL: ${{ steps.surface.outputs.app_url }}
          API_BASE_URL: ${{ steps.surface.outputs.api_base_url }}
          HEALTH_URL: ${{ steps.surface.outputs.health_url }}
        run: |
          curl --fail --silent --show-error --proto '=https' --max-filesize 2097152 \
            -D "$RUNNER_TEMP/health.headers" "$HEALTH_URL" -o "$RUNNER_TEMP/health.json"
          python - <<'PY'
          import json, os
          value = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "health.json"), encoding="utf-8"))
          if not isinstance(value, dict) or value.get("status") not in {"healthy", "ok"}:
              raise SystemExit("production Render health response is not healthy")
          headers = open(os.path.join(os.environ["RUNNER_TEMP"], "health.headers"), encoding="iso-8859-1").read().splitlines()
          origins = [line.split(":", 1)[1].strip() for line in headers if line.lower().startswith("access-control-allow-origin:")]
          if origins != [os.environ["APP_URL"]]:
              raise SystemExit("production CORS does not allow exactly the canonical app")
          PY
          DATASTORES_URL="${HEALTH_URL%/health}/health/datastores"
          curl --fail --silent --show-error --proto '=https' --max-filesize 2097152 \
            "$DATASTORES_URL" -o "$RUNNER_TEMP/datastores.json"
          python - <<'PY'
          import json, os
          value = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "datastores.json"), encoding="utf-8"))
          postgres = value.get("postgres")
          redis = value.get("redis")
          if not isinstance(postgres, dict) or postgres.get("status") != "ok" or not postgres.get("connected"):
              raise SystemExit("production PostgreSQL health is not ready")
          if not isinstance(redis, dict) or redis.get("status") != "ok" or not redis.get("connected"):
              raise SystemExit("production Redis/Valkey health is not ready")
          if redis.get("realtime_events_enabled") is not True:
              raise SystemExit("production realtime events are not enabled")
          if redis.get("distributed_locks_enabled") is not True or redis.get("distributed_locks_required") is not True:
              raise SystemExit("production distributed locks are not enforced")
          PY
          curl --fail --silent --show-error --proto '=https' --max-filesize 2097152 \
            "$APP_URL/" -o "$RUNNER_TEMP/production-app.html"
          test -s "$RUNNER_TEMP/production-app.html"
          echo "Verified $API_BASE_URL and $APP_URL against the live Render production deployment."
      - name: Upload sanitized production Render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-render-evidence-${{ env.TARGET_SHA }}
          path: production-render-manifest.json
          if-no-files-found: error
          retention-days: 7
