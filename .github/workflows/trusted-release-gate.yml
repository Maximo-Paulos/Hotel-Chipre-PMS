name: Trusted release gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-base-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the immutable PR base SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked trusted runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Confirm production Render is the post-merge cloud test surface
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          echo "No isolated Render QA service or pre-merge provider artifact is required."
          echo "The production Render QA cycle runs automatically after main receives the merge via .github/workflows/verify-preview-providers.yml."
