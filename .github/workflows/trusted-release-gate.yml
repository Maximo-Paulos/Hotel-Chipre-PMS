name: Trusted release gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  trusted-base-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the immutable PR base SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked trusted runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Validate head JSON as data using trusted base code
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python scripts/agent_ops/trusted_release_gate.py prepare \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-branch "$BASE_BRANCH" \
            --output-dir "$RUNNER_TEMP/trusted-head-evidence" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download only the verified provider-manifest artifact
        if: steps.prepare.outputs.evidence_required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/trusted-provider-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prepare.outputs.workflow_run_id }}
      - name: Require byte-identical provider and PR manifests
        if: steps.prepare.outputs.evidence_required == 'true'
        run: |
          python scripts/agent_ops/trusted_release_gate.py finalize \
            --input-dir "$RUNNER_TEMP/trusted-head-evidence" \
            --artifact-dir "$RUNNER_TEMP/trusted-provider-artifact"
