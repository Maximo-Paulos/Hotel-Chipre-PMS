name: Preview QA untrusted contract

on:
  pull_request:
    types: [opened, synchronize, reopened]

# This workflow intentionally has no Actions read permission, environment,
# provider secret, or artifact download. It executes branch-controlled code
# only for static diagnostics. The complete provider/bootstrap/browser cycle
# runs from the trusted default-branch workflow instead.
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the hash-locked trusted runtime on the CI Linux host
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Validate only the static branch contract
        run: |
          python -m json.tool qa/preview-manifest.example.json >/dev/null
          python -m json.tool qa/regression-catalog.json >/dev/null
          python scripts/agent_ops/validate_preview_manifest.py \
            qa/preview-manifest.example.json --skip-freshness
          python scripts/agent_ops/render_agents.py --check
          python scripts/agent_ops/sync_skills.py --check
      - name: Explain the trusted cloud gate
        run: |
          echo "This untrusted PR workflow never reads provider artifacts or secrets."
          echo "Dispatch verify-preview-providers.yml from the default branch for isolated cloud QA."
