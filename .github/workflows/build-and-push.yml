name: Build and Push Docker images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase image paths; ${{ github.repository }} can contain
      # uppercase (e.g. Maximo-Paulos/Hotel-Chipre-PMS), which fails `docker build`.
      - name: Compute lowercase image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME_BACKEND=${repo}-backend" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_FRONTEND=${repo}-frontend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -f Dockerfile.backend \
            -t "$REGISTRY/${{ env.IMAGE_NAME_BACKEND }}:${GITHUB_SHA}" \
            .

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -f Dockerfile.frontend \
            -t "$REGISTRY/${{ env.IMAGE_NAME_FRONTEND }}:${GITHUB_SHA}" \
            .

      - name: Verify image labels and create immutable release manifest
        run: |
          for image in \
            "$REGISTRY/${{ env.IMAGE_NAME_BACKEND }}:${GITHUB_SHA}" \
            "$REGISTRY/${{ env.IMAGE_NAME_FRONTEND }}:${GITHUB_SHA}"; do
            observed="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            test "$observed" = "$GITHUB_SHA"
          done
          python - <<'PY'
          import json
          import os

          repository = os.environ["GITHUB_REPOSITORY"].lower()
          sha = os.environ["GITHUB_SHA"]
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "environment": "build",
              "code_sha": sha,
              "artifact_refs": {
                  "backend": f"ghcr.io/{repository}-backend:{sha}",
                  "frontend": f"ghcr.io/{repository}-frontend:{sha}",
              },
          }
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          python scripts/agent_ops/verify_release_sha.py release-manifest.json \
            --expected-sha "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-environment build

      - name: Push backend image
        run: |
          docker push "$REGISTRY/${{ env.IMAGE_NAME_BACKEND }}:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          docker push "$REGISTRY/${{ env.IMAGE_NAME_FRONTEND }}:${GITHUB_SHA}"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
