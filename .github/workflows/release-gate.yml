name: Release gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  operating-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the trusted evidence runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Validate agents, skills, vault and manifests
        run: python scripts/agent_ops/validate_setup.py
      - name: Validate the production Render QA policy
        run: |
          test -f .github/workflows/verify-preview-providers.yml
          grep -q "name: Production Render QA cycle" .github/workflows/verify-preview-providers.yml
          grep -q "RENDER_PRODUCTION_SERVICE_ID" .github/workflows/verify-preview-providers.yml
          ! grep -q "manage_qa_baseline_lease.py" .github/workflows/verify-preview-providers.yml
          ! grep -q "provision_qa_bootstrap.py" .github/workflows/verify-preview-providers.yml
          echo "Pre-merge cloud QA is replaced by the post-merge production Render QA cycle."
