name: Release gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  operating-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the trusted evidence runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-qa-trusted.txt
      - name: Validate agents, skills, vault and manifests
        run: python scripts/agent_ops/validate_setup.py
      - name: Require provider-bound cloud evidence for release-relevant changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python scripts/agent_ops/check_release_evidence.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --branch "$EXPECTED_BRANCH" \
            --default-branch "$EXPECTED_DEFAULT_BRANCH"
