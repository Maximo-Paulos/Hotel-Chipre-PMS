name: PR Validation

on:
  pull_request:

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_chipre_ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_chipre_ci_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lint.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install pinned Python lint tool
        run: python -m pip install -r requirements-lint.txt

      - name: Check undefined names in Python source, migrations and tests
        run: python -m ruff check app scripts alembic tests --select F821 --target-version py311

      - name: Prepare an isolated PostgreSQL 16 test database
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          RUN_REF="test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DATABASE_NAME="hotel_chipre_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ROLE_NAME="hotel_chipre_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_runner"
          ROLE_PASSWORD="$(openssl rand -hex 24)"
          DATABASE_URL_TEST="postgresql+psycopg2://${ROLE_NAME}:${ROLE_PASSWORD}@127.0.0.1:5432/${DATABASE_NAME}"
          EVIDENCE_FILE="${RUNNER_TEMP}/postgres-test-evidence.json"
          echo "::add-mask::${ROLE_PASSWORD}"
          echo "::add-mask::${DATABASE_URL_TEST}"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d hotel_chipre_ci_migrations \
            -c "CREATE ROLE \"${ROLE_NAME}\" LOGIN BYPASSRLS PASSWORD '${ROLE_PASSWORD}'"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d hotel_chipre_ci_migrations \
            -c "CREATE DATABASE \"${DATABASE_NAME}\" OWNER \"${ROLE_NAME}\""
          cat > "${EVIDENCE_FILE}" <<EOF
          {"schema_version":1,"provider":"local-postgres","evidence_source":"local-ephemeral-fixture","environment":"test","branch_ref":"${RUN_REF}","production_ref":"ezkljznogqpmrjxyvklr","host":"127.0.0.1","port":5432,"database":"${DATABASE_NAME}","role":"${ROLE_NAME}","database_isolated":true,"data_classification":"synthetic-only"}
          EOF
          chmod 600 "${EVIDENCE_FILE}"
          {
            printf 'DATABASE_URL_TEST=%s\n' "${DATABASE_URL_TEST}"
            printf 'POSTGRES_TEST_DATABASE_URL_EXPLICIT=%s\n' "${DATABASE_URL_TEST}"
            printf 'POSTGRES_TEST_EXPECTED_HOST=127.0.0.1\n'
            printf 'POSTGRES_TEST_EXPECTED_ROLE=%s\n' "${ROLE_NAME}"
            printf 'POSTGRES_TEST_EXPECTED_DATABASE=%s\n' "${DATABASE_NAME}"
            printf 'POSTGRES_TEST_ISOLATED_BRANCH_REF=%s\n' "${RUN_REF}"
            printf 'POSTGRES_TEST_PRODUCTION_REF=ezkljznogqpmrjxyvklr\n'
            printf 'POSTGRES_TEST_PROVIDER_EVIDENCE_FILE=%s\n' "${EVIDENCE_FILE}"
            printf 'POSTGRES_TEST_ISOLATION_CONFIRMED=1\n'
            printf 'ALLOW_DESTRUCTIVE_POSTGRES_TESTS=1\n'
            printf 'APP_ENV=test\n'
            printf 'EXTERNAL_EFFECTS_ENABLED=false\n'
            printf 'CONNECTIONS_ENABLED=false\n'
            printf 'INBOUND_PROVIDER_EVENTS_ENABLED=false\n'
          } >> "${GITHUB_ENV}"

      - name: Apply migrations to a disposable CI database
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/hotel_chipre_ci_migrations
          APP_ENV: development
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate static GCP readiness contract
        run: python scripts/agent_ops/validate_gcp_readiness.py

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Run frontend build
        run: npm run build

  e2e:
    # Without this job the Playwright journeys only ran when someone remembered
    # to, and six of them rotted unnoticed (stale selectors hiding two real
    # bugs). Playwright boots a seeded PostgreSQL 16 backend
    # (scripts/serve_e2e_backend.py) and the Vite dev server itself.
    name: E2E journeys (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated PostgreSQL 16 E2E database and roles
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          DATABASE_NAME="hotel_chipre_e2e_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          APP_ROLE="${DATABASE_NAME}_app_runner"
          SEED_ROLE="${DATABASE_NAME}_seed_runner"
          APP_PASSWORD="$(openssl rand -hex 24)"
          SEED_PASSWORD="$(openssl rand -hex 24)"
          E2E_DATABASE_URL="postgresql://${APP_ROLE}:${APP_PASSWORD}@127.0.0.1:5432/${DATABASE_NAME}"
          E2E_SEED_DATABASE_URL="postgresql://${SEED_ROLE}:${SEED_PASSWORD}@127.0.0.1:5432/${DATABASE_NAME}"
          echo "::add-mask::${APP_PASSWORD}"
          echo "::add-mask::${SEED_PASSWORD}"
          echo "::add-mask::${E2E_DATABASE_URL}"
          echo "::add-mask::${E2E_SEED_DATABASE_URL}"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -c "CREATE ROLE \"${APP_ROLE}\" LOGIN PASSWORD '${APP_PASSWORD}'"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -c "CREATE ROLE \"${SEED_ROLE}\" LOGIN BYPASSRLS PASSWORD '${SEED_PASSWORD}'"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -c "CREATE DATABASE \"${DATABASE_NAME}\" OWNER \"${APP_ROLE}\""
          {
            printf 'E2E_DATABASE_URL=%s\n' "${E2E_DATABASE_URL}"
            printf 'E2E_POSTGRES_ISOLATED=true\n'
            printf 'E2E_POSTGRES_DATABASE_URL_EXPLICIT=%s\n' "${E2E_DATABASE_URL}"
            printf 'E2E_POSTGRES_SEED_DATABASE_URL=%s\n' "${E2E_SEED_DATABASE_URL}"
            printf 'E2E_POSTGRES_SEED_DATABASE_URL_EXPLICIT=%s\n' "${E2E_SEED_DATABASE_URL}"
            printf 'EXTERNAL_EFFECTS_ENABLED=false\n'
            printf 'CONNECTIONS_ENABLED=false\n'
            printf 'INBOUND_PROVIDER_EVENTS_ENABLED=false\n'
          } >> "${GITHUB_ENV}"

      - name: Run E2E journeys
        env:
          E2E_PYTHON: python
        run: npx playwright test --project=chromium --project=public-site --project=mobile-chromium --project=preview-host-routing

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report
            frontend/test-results
          retention-days: 14
