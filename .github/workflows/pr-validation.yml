name: PR Validation

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply migrations to a disposable CI database
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
          APP_ENV: development
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate static GCP readiness contract
        run: python scripts/agent_ops/validate_gcp_readiness.py

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Run frontend build
        run: npm run build

  e2e:
    # Without this job the Playwright journeys only ran when someone remembered
    # to, and six of them rotted unnoticed (stale selectors hiding two real
    # bugs). Playwright boots the seeded SQLite backend
    # (scripts/serve_e2e_backend.py) and the Vite dev server itself.
    name: E2E journeys (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E journeys
        env:
          E2E_PYTHON: python
        run: npx playwright test --project=chromium --project=mobile-chromium --project=preview-host-routing

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report
            frontend/test-results
          retention-days: 14
