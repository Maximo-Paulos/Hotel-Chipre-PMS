<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hotels-PMS | PMS hotelero para hoteles independientes</title>
    <meta name="description" content="Sistema de gestión hotelera para centralizar reservas, habitaciones, huéspedes y cobros en un solo lugar." />
    <meta name="theme-color" content="#12324f" />
    <meta property="og:title" content="Hotels-PMS | PMS hotelero para hoteles independientes" />
    <meta property="og:description" content="Sistema de gestión hotelera para centralizar reservas, habitaciones, huéspedes y cobros en un solo lugar." />
    <meta property="og:site_name" content="Hotels-PMS" />
    <meta property="og:image" content="https://hotels-pms.com/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Hotels-PMS: sistema de gestión hotelera para hoteles independientes" />
    <meta property="og:url" content="https://hotels-pms.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotels-PMS | PMS hotelero para hoteles independientes" />
    <meta name="twitter:description" content="Sistema de gestión hotelera para centralizar reservas, habitaciones, huéspedes y cobros en un solo lugar." />
    <meta name="twitter:image" content="https://hotels-pms.com/brand/og-default.png" />
    <meta name="twitter:image:alt" content="Hotels-PMS: sistema de gestión hotelera para hoteles independientes" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hotels-pms.com/" />
    <script>
      (function () {
        var appHost = "app.hotels-pms.com";

        var path = window.location.pathname || "/";
        var host = window.location.hostname || "";
        var isAppHost = host === appHost || host.endsWith("." + appHost);
        var privatePaths = [
          "/login",
          "/register-owner",
          "/invitations/accept",
          "/verify-email",
          "/forgot-password",
          "/reset-password",
          "/adminpmsmaster"
        ];
        var isPrivatePath = privatePaths.some(function (route) {
          return path === route || path.indexOf(route + "/") === 0;
        });
        var shouldNoindex = isAppHost || isPrivatePath;

        // Marketing pages are built with their own title, description,
        // canonical and og:* already in the markup (see marketing-html.mjs).
        // Rewriting them here would replace a correct per-route value with a
        // generic one before React even mounts, so this pre-hydration pass now
        // only runs where it is actually needed: forcing noindex on the app
        // host and on auth paths.
        if (!shouldNoindex) return;

        var title = "Hotels-PMS | Acceso al sistema";
        var description = "Sistema de gestión hotelera para centralizar reservas, habitaciones, huéspedes y cobros en un solo lugar.";

        document.title = title;

        function upsertMeta(selector, attribute, value) {
          var element = document.head.querySelector(selector);
          if (!element) {
            element = document.createElement("meta");
            var match = selector.match(/\[(name|property)="([^"]+)"\]/);
            if (match) {
              element.setAttribute(match[1], match[2]);
            }
            document.head.appendChild(element);
          }
          element.setAttribute(attribute, value);
        }

        upsertMeta('meta[name="description"]', "content", description);
        upsertMeta('meta[name="robots"]', "content", shouldNoindex ? "noindex, nofollow" : "index, follow");
        upsertMeta('meta[property="og:title"]', "content", title);
        upsertMeta('meta[property="og:description"]', "content", description);
        upsertMeta('meta[property="og:site_name"]', "content", "Hotels-PMS");
        upsertMeta('meta[property="og:image"]', "content", window.location.origin + "/brand/og-default.png");
        upsertMeta('meta[property="og:image:width"]', "content", "1200");
        upsertMeta('meta[property="og:image:height"]', "content", "630");
        upsertMeta('meta[property="og:image:type"]', "content", "image/png");
        upsertMeta('meta[property="og:image:alt"]', "content", "Hotels-PMS: sistema de gestión hotelera para hoteles independientes");
        upsertMeta('meta[property="og:url"]', "content", window.location.origin + path);
        upsertMeta('meta[name="twitter:title"]', "content", title);
        upsertMeta('meta[name="twitter:description"]', "content", description);
        upsertMeta('meta[name="twitter:image"]', "content", window.location.origin + "/brand/og-default.png");
        upsertMeta('meta[name="twitter:image:alt"]', "content", "Hotels-PMS: sistema de gestión hotelera para hoteles independientes");

        var canonical = document.head.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }
        canonical.href = window.location.origin + path;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
