<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Conexiones de Hotel Chipre PMS</title><desc id="desc">Estado de Booking, Mercado Pago y correo dentro de la configuración.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/><rect width="260" height="900" fill="#102a43"/><text x="42" y="64" fill="#fff" font-family="Arial" font-size="26" font-weight="700">Hotel Chipre</text><text x="42" y="91" fill="#9fb3c8" font-family="Arial" font-size="14">Operación hotelera</text><text x="48" y="235" fill="#d9e2ec" font-family="Arial" font-size="17">Dashboard</text><text x="48" y="285" fill="#d9e2ec" font-family="Arial" font-size="17">Reservas</text><rect x="24" y="310" width="212" height="48" rx="12" fill="#1f6f8b"/><text x="48" y="341" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Configuración</text>
  <rect x="260" width="1180" height="900" fill="#fff"/><text x="312" y="72" fill="#102a43" font-family="Arial" font-size="30" font-weight="700">Conexiones</text><text x="312" y="105" fill="#627d98" font-family="Arial" font-size="16">Administrá canales y cobros desde un solo lugar</text>
  <rect x="312" y="145" width="1066" height="142" rx="16" fill="#fff" stroke="#d9e2ec"/><circle cx="370" cy="216" r="30" fill="#003b95"/><text x="358" y="225" fill="#fff" font-family="Arial" font-size="25" font-weight="700">B</text><text x="430" y="198" fill="#102a43" font-family="Arial" font-size="21" font-weight="700">Booking.com</text><text x="430" y="225" fill="#627d98" font-family="Arial" font-size="14">Disponibilidad y reservas del canal</text><rect x="1165" y="190" width="120" height="32" rx="16" fill="#d9f7e8"/><text x="1190" y="211" fill="#176b4b" font-family="Arial" font-size="13" font-weight="700">Preparado</text><text x="430" y="253" fill="#829ab1" font-family="Arial" font-size="12">Última verificación: pendiente de habilitar el entorno del proveedor</text>
  <rect x="312" y="315" width="1066" height="142" rx="16" fill="#fff" stroke="#d9e2ec"/><circle cx="370" cy="386" r="30" fill="#009ee3"/><text x="352" y="395" fill="#fff" font-family="Arial" font-size="21" font-weight="700">MP</text><text x="430" y="368" fill="#102a43" font-family="Arial" font-size="21" font-weight="700">Mercado Pago</text><text x="430" y="395" fill="#627d98" font-family="Arial" font-size="14">Enlaces de cobro y notificaciones verificadas</text><rect x="1165" y="360" width="120" height="32" rx="16" fill="#fff4cc"/><text x="1181" y="381" fill="#8a6412" font-family="Arial" font-size="13" font-weight="700">Pendiente</text><text x="430" y="423" fill="#829ab1" font-family="Arial" font-size="12">La activación requiere credenciales del hotel y una prueba controlada</text>
  <rect x="312" y="485" width="1066" height="142" rx="16" fill="#fff" stroke="#d9e2ec"/><circle cx="370" cy="556" r="30" fill="#1f6f8b"/><text x="357" y="565" fill="#fff" font-family="Arial" font-size="22" font-weight="700">✉</text><text x="430" y="538" fill="#102a43" font-family="Arial" font-size="21" font-weight="700">Correo de confirmaciones</text><text x="430" y="565" fill="#627d98" font-family="Arial" font-size="14">Comprobantes e historial de envíos</text><rect x="1165" y="530" width="120" height="32" rx="16" fill="#d9f7e8"/><text x="1190" y="551" fill="#176b4b" font-family="Arial" font-size="13" font-weight="700">Disponible</text><text x="430" y="593" fill="#829ab1" font-family="Arial" font-size="12">Cada intento conserva su estado y evita duplicados</text>
</svg>
