<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard operativo de Hotel Chipre PMS</title>
  <desc id="desc">Indicadores del hotel, próximas llegadas y tareas del turno.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect width="260" height="900" fill="#102a43"/>
  <text x="42" y="64" fill="#fff" font-family="Arial" font-size="26" font-weight="700">Hotel Chipre</text>
  <text x="42" y="91" fill="#9fb3c8" font-family="Arial" font-size="14">Operación hotelera</text>
  <rect x="24" y="140" width="212" height="48" rx="12" fill="#1f6f8b"/><text x="48" y="171" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Dashboard</text>
  <text x="48" y="235" fill="#d9e2ec" font-family="Arial" font-size="17">Reservas</text><text x="48" y="285" fill="#d9e2ec" font-family="Arial" font-size="17">Habitaciones</text><text x="48" y="335" fill="#d9e2ec" font-family="Arial" font-size="17">Pendientes</text><text x="48" y="385" fill="#d9e2ec" font-family="Arial" font-size="17">Caja</text>
  <rect x="260" width="1180" height="900" fill="#fff"/>
  <text x="312" y="72" fill="#102a43" font-family="Arial" font-size="30" font-weight="700">Buen día, equipo</text><text x="312" y="105" fill="#627d98" font-family="Arial" font-size="16">Resumen operativo · martes 10 de septiembre</text>
  <rect x="312" y="145" width="250" height="128" rx="16" fill="#e8f1f5"/><text x="338" y="183" fill="#486581" font-family="Arial" font-size="15">Ocupación de hoy</text><text x="338" y="232" fill="#102a43" font-family="Arial" font-size="40" font-weight="700">78%</text><text x="455" y="232" fill="#16825d" font-family="Arial" font-size="14">+6% vs. ayer</text>
  <rect x="584" y="145" width="250" height="128" rx="16" fill="#fef3c7"/><text x="610" y="183" fill="#7c5e10" font-family="Arial" font-size="15">Llegadas próximas</text><text x="610" y="232" fill="#102a43" font-family="Arial" font-size="40" font-weight="700">12</text><text x="610" y="255" fill="#627d98" font-family="Arial" font-size="13">en las próximas 24 h</text>
  <rect x="856" y="145" width="250" height="128" rx="16" fill="#e7f6ef"/><text x="882" y="183" fill="#276749" font-family="Arial" font-size="15">Caja del día</text><text x="882" y="232" fill="#102a43" font-family="Arial" font-size="34" font-weight="700">$ 248.500</text><text x="882" y="255" fill="#627d98" font-family="Arial" font-size="13">ARS · turno abierto</text>
  <rect x="1128" y="145" width="250" height="128" rx="16" fill="#fce8e6"/><text x="1154" y="183" fill="#9b2c2c" font-family="Arial" font-size="15">Pendientes del turno</text><text x="1154" y="232" fill="#102a43" font-family="Arial" font-size="40" font-weight="700">4</text><text x="1154" y="255" fill="#627d98" font-family="Arial" font-size="13">2 requieren revisión</text>
  <rect x="312" y="315" width="570" height="420" rx="16" fill="#fff" stroke="#d9e2ec"/><text x="342" y="360" fill="#102a43" font-family="Arial" font-size="21" font-weight="700">Próximas llegadas</text><text x="342" y="388" fill="#829ab1" font-family="Arial" font-size="13">Ordenadas por ingreso al hotel</text>
  <g font-family="Arial" font-size="15"><text x="342" y="440" fill="#102a43" font-weight="700">08:30</text><text x="430" y="440" fill="#102a43">María González</text><text x="690" y="440" fill="#627d98">Habitación 101</text><line x1="342" y1="462" x2="852" y2="462" stroke="#edf2f7"/><text x="342" y="510" fill="#102a43" font-weight="700">10:00</text><text x="430" y="510" fill="#102a43">Julián Pérez</text><text x="690" y="510" fill="#627d98">Habitación 204</text><line x1="342" y1="532" x2="852" y2="532" stroke="#edf2f7"/><text x="342" y="580" fill="#102a43" font-weight="700">12:30</text><text x="430" y="580" fill="#102a43">Laura Silva</text><text x="690" y="580" fill="#627d98">Sin asignar</text><line x1="342" y1="602" x2="852" y2="602" stroke="#edf2f7"/><text x="342" y="650" fill="#102a43" font-weight="700">14:00</text><text x="430" y="650" fill="#102a43">Tomás Romero</text><text x="690" y="650" fill="#627d98">Habitación 305</text></g>
  <rect x="914" y="315" width="464" height="420" rx="16" fill="#fff" stroke="#d9e2ec"/><text x="944" y="360" fill="#102a43" font-family="Arial" font-size="21" font-weight="700">Tareas del turno</text><rect x="944" y="398" width="404" height="70" rx="10" fill="#fff8e1"/><circle cx="970" cy="433" r="9" fill="#d69e2e"/><text x="995" y="429" fill="#102a43" font-family="Arial" font-size="15">Confirmar late check-out</text><text x="995" y="450" fill="#829ab1" font-family="Arial" font-size="12">Recepción · Alta</text><rect x="944" y="484" width="404" height="70" rx="10" fill="#f0fdf4"/><circle cx="970" cy="519" r="9" fill="#38a169"/><text x="995" y="515" fill="#102a43" font-family="Arial" font-size="15">Revisar habitación 208</text><text x="995" y="536" fill="#829ab1" font-family="Arial" font-size="12">Mantenimiento · En curso</text><rect x="944" y="570" width="404" height="70" rx="10" fill="#fef2f2"/><circle cx="970" cy="605" r="9" fill="#e53e3e"/><text x="995" y="601" fill="#102a43" font-family="Arial" font-size="15">Entregar ropa blanca</text><text x="995" y="622" fill="#829ab1" font-family="Arial" font-size="12">Limpieza · Crítica</text>
</svg>
