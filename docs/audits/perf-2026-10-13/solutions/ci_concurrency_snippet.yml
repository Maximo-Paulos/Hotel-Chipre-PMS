# S21: recortar minutos de CI sin tocar los jobs (O3/O5).
# Reemplaza el bloque `on:` de .github/workflows/pr-validation.yml por este y agrega `concurrency`.
#
# OJO con `paths-ignore`: si la rama exige estos checks como *required*, un PR que solo toca
# docs queda con los checks en "Pending" y no se puede mergear. En ese caso usar el filtro
# dentro del job (dorny/paths-filter) y dejar un job final que siempre corra.
name: PR Validation

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "knowledge/**"
      - "qa/**"
      - ".graphify/**"
      - "**/*.md"

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

